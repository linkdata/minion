name: build

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request: {} # Include stacked PRs targeting another branch.

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Go vet
        run: go vet ./...

      - name: Vet darwin build
        run: GOOS=darwin go vet ./...

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: |
          runner_uid="$(id -u)"
          sudo systemd-run --scope --quiet --collect --same-dir --uid="$runner_uid" \
            -p Delegate=yes -p TasksMax=256 -p MemoryMax=4G -- \
            /usr/bin/env "HOME=$HOME" "PATH=$PATH" "MINION_RUN_UID=$runner_uid" bash -euc '
              test "$(id -u)" = "$MINION_RUN_UID"
              cgroup="$(sed -n "s/^0:://p" /proc/self/cgroup)"
              test -n "$cgroup"
              mkdir "/sys/fs/cgroup$cgroup/minion-ci-probe"
              rmdir "/sys/fs/cgroup$cgroup/minion-ci-probe"
              go test -race -coverprofile=coverage.out ./...
            '

      - name: Coverage
        id: coverage
        run: |
          coverage="$(go tool cover -func=coverage.out | tail -n 1 | awk '{ print $3 }')"
          test -n "$coverage"
          echo "coverage=$coverage" >> "$GITHUB_OUTPUT"
          echo "Total coverage: $coverage"

      - name: Build
        run: go build -buildvcs=false -o "$RUNNER_TEMP/minion" ./cmd/minion

  coverage:
    needs: build
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Publish coverage badge
        uses: linkdata/gitcoverage@03383ad3a6ff45e117a50d29d21c3a95c2d5d12a # v11
        with:
          coverage: ${{ needs.build.outputs.coverage }}
          token: ${{ github.token }}
