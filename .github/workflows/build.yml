name: build

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request: {} # Include stacked PRs targeting another branch.

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Go vet
        run: go vet ./...

      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: |
          # Maximum-size wire fixtures exceed the race memory budget.
          go test -count=1 -run '^TestHTTPWireRouteCapsUseActualJSONBytes$' ./internal/action
          go test -race -coverprofile=coverage.out ./...

      - name: Coverage
        id: coverage
        run: |
          coverage="$(go tool cover -func=coverage.out | tail -n 1 | awk '{ print $3 }')"
          test -n "$coverage"
          echo "coverage=$coverage" >> "$GITHUB_OUTPUT"
          echo "Total coverage: $coverage"

      - name: Build
        run: go build -buildvcs=false -o "$RUNNER_TEMP/minion" ./cmd/minion

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Select supported Git on macOS
        if: runner.os == 'macOS'
        run: |
          brew list --versions git || brew install git
          echo "$(brew --prefix git)/bin" >> "$GITHUB_PATH"

      - name: Show Git version
        run: git --version

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v -count=1 -timeout=20m ./...

      - name: Build
        run: go build -buildvcs=false ./cmd/minion

  coverage:
    needs: build
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Publish coverage badge
        uses: linkdata/gitcoverage@03383ad3a6ff45e117a50d29d21c3a95c2d5d12a # v11
        with:
          coverage: ${{ needs.build.outputs.coverage }}
          token: ${{ github.token }}
